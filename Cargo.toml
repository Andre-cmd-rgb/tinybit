[workspace]
resolver = "2"
members = [
    "crates/tiny-bit-core",
    "crates/tiny-bit-tools",
    "crates/tiny-bit-infer",
    "crates/tiny-bit-train",
    "crates/tiny-bit-cli",
    "tests",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/Andre-cmd-rgb/tiny-bit"
authors    = ["Andre"]

[workspace.dependencies]
# Tensor framework — pure Rust, CPU + Metal + CUDA
# Metal feature enabled per-crate only on macOS (see crate Cargo.toml target deps)
candle-core    = { version = "0.8.0" }
candle-nn      = { version = "0.8.0" }

# Tokenizer — use fancy-regex (pure Rust) instead of onig (needs C++)
tokenizers     = { version = "0.21.0", default-features = false, features = ["fancy-regex", "http"] }

# Serialization
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
toml           = "0.8"
safetensors    = "0.4.5"

# CLI
clap           = { version = "4.5", features = ["derive", "env"] }

# Async + HTTP
tokio          = { version = "1.40", features = ["full"] }
axum           = { version = "0.7", features = ["json"] }
tower          = "0.4"
tower-http     = { version = "0.5", features = ["cors", "trace"] }

# Errors + logging
anyhow         = "1.0"
thiserror      = "1.0"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
rayon          = "1.10"
indicatif      = { version = "0.17", features = ["rayon"] }
memmap2        = "0.9"
half           = { version = "2.4", features = ["num-traits"] }
rand           = "0.8"
chrono         = { version = "0.4", features = ["serde"] }

# Tools — built-in
evalexpr       = "11.3"
rusqlite       = { version = "0.31", features = ["bundled"] }

# HuggingFace Hub for downloading tokenizers
hf-hub         = { version = "0.3", features = ["tokio"] }

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
panic          = "abort"

[profile.release.build-override]
opt-level = 3
