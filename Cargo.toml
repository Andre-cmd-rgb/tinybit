[workspace]
resolver = "2"
members = [
    "crates/tinybit-core",
    "crates/tinybit-tools",
    "crates/tinybit-infer",
    "crates/tinybit-train",
    "crates/tinybit-cli",
    "tests",
]

[workspace.package]
version    = "1.0.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/Andre-cmd-rgb/tinybit"
authors    = ["Andre"]

[workspace.dependencies]
# Tensor framework — pure Rust, CPU + Metal + CUDA
# Metal feature enabled per-crate only on macOS (see crate Cargo.toml target deps)
candle-core    = { version = "0.8.0" }
candle-nn      = { version = "0.8.0" }

# Tokenizer — use fancy-regex (pure Rust) instead of onig (needs C++)
tokenizers     = { version = "0.21.0", default-features = false, features = ["fancy-regex", "http"] }

# Serialization
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
toml           = "0.8"
safetensors    = "0.4.5"

# CLI
clap           = { version = "4.5", features = ["derive", "env"] }

# Async runtime — used by the CLI entrypoint and the `download` command.
# tinybit V1.0 is local-CLI-first: there is no HTTP server.
tokio          = { version = "1.40", features = ["rt-multi-thread", "macros"] }

# Errors + logging
anyhow         = "1.0"
thiserror      = "1.0"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
rayon          = "1.10"
indicatif      = { version = "0.17", features = ["rayon"] }
memmap2        = "0.9"
half           = { version = "2.4", features = ["num-traits"] }
rand           = "0.8"
chrono         = { version = "0.4", features = ["serde"] }

# Tools — built-in
evalexpr       = "11.3"
rusqlite       = { version = "0.31", features = ["bundled"] }

# Direct HTTPS client for `tinybit download` (fetches tokenizer.json).
# Replaced hf-hub, whose tokio Api built a malformed URL in some environments
# ("relative URL without a base") and broke the download outright.
reqwest        = { version = "0.11" }

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
panic          = "abort"

[profile.release.build-override]
opt-level = 3
