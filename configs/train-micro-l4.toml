# 50M `micro` model on a single NVIDIA L4 (24 GB VRAM).
#
# Per-step token budget:
#   batch 12 × seq 1024 × grad_accum 4 = 49_152 tokens / step
#
# Total token budget:
#   20_000 steps × 49_152 ≈ 0.98 B tokens
#
# Wall-clock estimate on L4 SPOT (~$0.22/hr):
#   ~12-18 h, ~$3-5 total.
#
# Pair with:
#   DATA_TOKENS=1500000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 12
grad_accum     = 4
total_steps    = 20000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 500
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
