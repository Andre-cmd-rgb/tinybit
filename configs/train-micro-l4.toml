# 50M `micro` model on a single NVIDIA L4 (24 GB VRAM).
#
# Per-step token budget:
#   batch 11 × seq 512 × grad_accum 6 = 33_792 tokens / step
#
# Total token budget (DEFINITIVE RUN, 2026-05-31):
#   70_000 steps × 33_792 ≈ 2.37 B tokens (~47x params — small models keep
#   improving well past Chinchilla; cf. SmolLM). Scaled to fit a hard <€100
#   on-demand-L4 budget (~6.5 s/step → ~5.3 days → ~€85 STANDARD). A 5B-token run
#   would be ~148k steps / ~11 days / ~€185 — over budget — so it was scaled down.
#   Pair with DATA_TOKENS=2400000000 and CUSTOM_CHAT_EPOCHS=8 (identity/tool data).
#   NOTE (2026-06-07): the first definitive run used CUSTOM_CHAT_EPOCHS=50. That
#   repeated the narrow ~1.3k-example custom set 50× and burned tool-calling in as
#   a reflex — the model fired tools on almost any prompt (incl. greetings) with
#   garbage args. Keep this LOW (≈8–10): the base mix already carries ~22% diverse
#   no-tool instruction data (OpenHermes/dolphin) that is NOT repeated, so the
#   custom set only needs a few passes to teach identity + the tool protocol.
#   Also keep the custom set's tool/no-tool ratio balanced — see datasets/README.md.
#
# Throughput tuning (2026-05-28): bf16 mixed precision + a larger microbatch.
# The fused WKV kernel launches one block per (batch, head); at batch 6 that is
# only 36 blocks on the L4's 58 SMs (low occupancy). batch 11 → 66 blocks
# (full occupancy) and reduces the grad_accum iteration count (less per-microbatch
# graph-build overhead). bf16 halves activation VRAM, making the bigger batch fit.
# Live L4 benchmarks on 2026-05-28:
#   batch 10 / accum 7: 16.999 s/step, 2.11k tok/s
#   batch 11 / accum 6: 15.180 s/step, 2.23k tok/s  <-- VALIDATED working config
# batch 12 OOMs on the L4 (24 GB) regardless of cross-entropy path.
#
# 2026-05-31 — VERIFIED LIVE ON L4: the 2026-05-30 raise to batch 14 + fused_ce
# was reverted. The premise (fused_ce frees the (B*T, vocab) logits tensor, so
# batch can rise to 14) did NOT hold: on an idle L4 with 22.5 GB free, an A/B at
# identical batch=11 showed fused_ce=true OOMs while fused_ce=false fits. So
# fused_ce as currently implemented is a NET memory REGRESSION here, not a saving
# — batches 11/12/13/14 all OOM with it on. Until that is investigated and fixed,
# this config uses the validated batch=11 / accum=6 / standard CE recipe (the
# 6.5 s/step run in CLAUDE.md design-decision 16). Do not re-enable fused_ce or
# raise batch_size without a live L4 A/B that clears step 0.
#
# Pair with:
#   DATA_TOKENS=1500000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 11
grad_accum     = 6
total_steps    = 70000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0
bf16           = true

# fused_ce: ROOT-CAUSED AND FIXED IN CODE (loss.rs), but left OFF here pending a
# live GPU A/B. The regression was a missing `.detach()` on `weight` inside
# fused_cross_entropy_grads: `weight` requires grad, so the per-chunk (C, vocab)
# logits/softmax became retained autograd nodes (pinned by grad_normed_chunks for
# the whole loop) — fused CE used MORE memory than standard CE and OOMed even at
# batch=11. Now both `normed` AND `weight` are detached (grads are analytic), so
# peak extra memory is one (chunk_rows, vocab) tile. Guarded by
# loss::tests::fused_ce_outputs_are_detached. Before flipping this back to true
# (and trying batch>11), confirm the memory win with a live L4 A/B that clears
# step 0 — do NOT assume it from the code change alone (that assumption is exactly
# what caused the original OOM).
fused_ce       = false

save_every     = 500
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
