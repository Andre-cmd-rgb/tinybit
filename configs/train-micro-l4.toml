# 50M `micro` model on a single NVIDIA L4 (24 GB VRAM).
#
# Per-step token budget:
#   batch 6 × seq 512 × grad_accum 11 = 33_792 tokens / step
#
# Total token budget:
#   25_000 steps × 33_792 ≈ 0.84 B tokens (~17x params; near Chinchilla-optimal)
#
# batch_size is HELD at 6 for now. A previous note here proposed batch 12 based
# on a "~7 of 22.5 GB at batch 6" VRAM reading — but that reading was taken while
# the LayerNorm gradient bug was silently pruning the backward graph, so it
# *under*-counted backward activations. With gradients now flowing through the
# full stack, real peak VRAM is higher; re-measure on a live L4 (watch
# `nvidia-smi` for the first ~50 steps) before raising batch_size again.
#
# Pair with:
#   DATA_TOKENS=1500000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 6
grad_accum     = 11
total_steps    = 25000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 500
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
