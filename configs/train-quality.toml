# Quality overnight training — tuned for a single L4 / T4 GPU over ~10-14 hours.
#
# Pairs with: configs/micro.toml (50M params)
#
# Budget assumptions:
#   batch_size 4 × grad_accum 8 = effective batch 32
#   max_seq_len from model config is 1024 → 32 * 1024 = 32_768 tokens / step
#   30_000 steps × 32_768 = ~983M tokens
#
# This is roughly Chinchilla-optimal for a 50M-param model (20 toks/param).
#
# Pair with DATA_TOKENS=1_000_000_000 in scripts/gcp_launch.sh so prepare_data
# collects enough material for one full pass without re-walking the same chunks.
#
# LR notes:
#   peak_lr 3e-4 with WSD (2% warmup, 78% stable, 20% cosine decay to peak/10)
#   grad_clip 1.0 — global L2 norm clip, applied every optimizer step
#
# If you only have time for ~5h of training, set total_steps = 15000 and
# DATA_TOKENS = 500_000_000.

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 4
grad_accum     = 8
total_steps    = 30000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 500
eval_every     = 200
eval_batches   = 20

smoke_test_steps = 0
