# tinybit nano-coding — coding-specialized variant of `nano` (~25M params).
#
# Architecture is IDENTICAL to configs/nano.toml. What makes this a "coding"
# model is the TRAINING DATA, not the shape:
#   - prepare the dataset with PROFILE=coding (code-heavy mix; see scripts/prepare_data.sh)
#   - chat/eval with `--profile coding` so the coding system prompt is used
# Because the shapes match, a checkpoint trained either way loads under either
# config — the families differ only in what they were trained on.
vocab_size  = 32008
num_layers  = 9
d_model     = 320
d_ffn       = 1120
num_heads   = 5
head_dim    = 64
max_seq_len = 512
dropout     = 0.05
spec_heads  = 0
ternary_ffn = false
int8_time   = false
