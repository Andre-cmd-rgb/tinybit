# 501M `base` model on a single NVIDIA H100 80GB (a3-highgpu-1g).
#
# Per-step token budget:
#   batch 8 × seq 2048 × grad_accum 4 = 65_536 tokens / step
#
# Total token budget:
#   20_000 steps × 65_536 ≈ 1.31 B tokens
#
# Wall-clock estimate on H100 SPOT (~$3.30/hr):
#   ~12-18 h, ~$40-60 total.
#
# Pair with:
#   DATA_TOKENS=2000000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 8
grad_accum     = 4
total_steps    = 20000
peak_lr        = 1e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 1000
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
