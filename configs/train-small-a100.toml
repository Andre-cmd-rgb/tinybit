# 150M `small` model on a single NVIDIA A100 40GB (a2-highgpu-1g).
#
# 40 GB gives us plenty of headroom for batch_size 16 at seq_len 1024 even
# with full F32 activations. We keep effective batch at 32 (× 1024 tokens =
# 32_768 tokens / step) to match the L4 / H100 configs, so the only
# variable across hardware is wall time and how many tokens you can afford.
#
# Per-step token budget:
#   batch 16 × seq 1024 × grad_accum 2 = 32_768 tokens / step
#
# Total token budget:
#   60_000 steps × 32_768 ≈ 1.97 B tokens (~Chinchilla-optimal for 150M)
#
# Wall-clock estimate on A100 SPOT (~$1.10/hr):
#   ~15-20 h, ~$17-22 total. SPOT eviction usually means losing ~10 min;
#   the next launch resumes from the latest checkpoint in GCS.
#
# Pair with:
#   DATA_TOKENS=2000000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 16
grad_accum     = 2
total_steps    = 60000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 1000
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
