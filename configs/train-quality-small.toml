# Quality training for the 150M `small` preset on a single H100 / A100-80GB.
#
# Sized to put the GPU under real load: batch_size 32 × seq 1024 = 32_768
# tokens per microbatch, no grad accumulation — every step is one forward
# + one backward. On an H100 80GB that uses ~25 GB of activations + weights
# + optimizer state, leaving plenty of margin.
#
# Token budget:
#   60_000 steps × 32_768 tokens/step ≈ 1.97 B tokens
#
# Pair this with:
#   DATA_TOKENS=2000000000
# so prepare_data.sh actually collects ~2 B distinct tokens.
#
# Wall-clock estimates:
#   H100 80GB on-demand:  ~10-14 h   (~$140-200)
#   H100 80GB spot:       same, ~$45-65 if not preempted
#   A100 80GB on-demand:  ~18-22 h   (~$90-115)
#   L4:                   not recommended at this size — would take ~3 days
#
# If you have 24 hours of compute and want closer to Chinchilla-optimal
# (3 B tokens for 150 M params), bump total_steps to 100_000 and
# DATA_TOKENS to 3_000_000_000.

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

# Effective batch 32. Larger model + larger LR-stability need lower peak_lr
# than micro; we drop from 3e-4 to 2e-4.
batch_size     = 32
grad_accum     = 1
total_steps    = 60000
peak_lr        = 2e-4
weight_decay   = 0.01
grad_clip      = 1.0

# Save less frequently than micro to keep GCS upload overhead low on long runs.
save_every     = 1000
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
