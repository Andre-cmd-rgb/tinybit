# 25M `nano` model on a single NVIDIA L4 (24 GB VRAM).
#
# Per-step token budget:
#   batch 16 × seq 1024 × grad_accum 4 = 65_536 tokens / step
#
# Total token budget:
#   15_000 steps × 65_536 ≈ 0.98 B tokens
#
# Wall-clock estimate on L4 SPOT (~$0.22/hr):
#   ~4-6 h, ~$1-2 total.
#
# Pair with:
#   DATA_TOKENS=1500000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 16
grad_accum     = 4
total_steps    = 15000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 500
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
