# 150M `qbit` model on a single NVIDIA L4 (24 GB VRAM).
#
# Per-step token budget:
#   batch 2 × seq 1024 × grad_accum 16 = 32_768 tokens / step  (≈ micro's 33.8k)
#
# Total token budget:
#   25_000 steps × 32_768 ≈ 0.82 B tokens (~5.5x params)
#
# BATCH SIZE IS A CONSERVATIVE ESTIMATE, NOT YET LIVE-VALIDATED. qbit is the
# largest shipped model (d768/L13/seq1024 ≈ 150M). Each sample costs ~3.2× micro's
# activation memory and the 150M params add ~2.4 GB of fixed optimizer state, so
# this starts low at batch 2. If it OOMs at step 0, drop to 1; if it fits with
# free VRAM, raise it. Validate on a live L4 before a full run.
#
# Pair with:
#   DATA_TOKENS=1500000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 2
grad_accum     = 16
total_steps    = 25000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0
bf16           = true

# fused_ce stays OFF until the cross-entropy memory path is re-validated on GPU
# (see configs/train-micro-l4.toml and CLAUDE.md). Standard CE here.
fused_ce       = false

save_every     = 500
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
