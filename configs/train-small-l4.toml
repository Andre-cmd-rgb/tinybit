# 150M `small` model on a single NVIDIA L4 (24 GB VRAM).
#
# L4 is memory-tight for `small`, so we use a small microbatch and rely on
# gradient accumulation to reach a reasonable effective batch.
#
# Per-step token budget:
#   batch 8 × seq 1024 × grad_accum 4 = 32_768 tokens / step
#
# Total token budget:
#   30_000 steps × 32_768 ≈ 0.98 B tokens
#
# Wall-clock estimate on L4 SPOT (~$0.22/hr):
#   ~30-40 h, ~$8-10 total. Eviction is a real risk over multi-day runs —
#   training resumes from the most recent checkpoint, so you may end up
#   relaunching once or twice. Total realistic cost ~$10-15.
#
# Pair with:
#   DATA_TOKENS=1500000000   (1B tokens consumed + headroom for val/skipped batches)

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 8
grad_accum     = 4
total_steps    = 30000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 500
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
