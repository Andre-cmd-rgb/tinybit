# tinybit base-coding — coding-specialized variant of `base` (~501M params).
#
# Architecture is IDENTICAL to configs/base.toml. What makes this a "coding"
# model is the TRAINING DATA, not the shape:
#   - prepare the dataset with PROFILE=coding (code-heavy mix; see scripts/prepare_data.sh)
#   - chat/eval with `--profile coding` so the coding system prompt is used
# NOTE: base does not fit on a single L4 for training — it is an architectural
# preset for inference of checkpoints trained on larger hardware.
vocab_size  = 32008
num_layers  = 17
d_model     = 1280
d_ffn       = 4480
num_heads   = 20
head_dim    = 64
max_seq_len = 2048
dropout     = 0.05
spec_heads  = 0
ternary_ffn = false
int8_time   = false
