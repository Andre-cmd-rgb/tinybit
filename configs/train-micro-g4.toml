# 50M `micro` model on a single NVIDIA RTX Pro 6000 (96 GB VRAM, g4-standard-48).
#
# Per-step token budget:
#   batch 32 × seq 1024 × grad_accum 4 = 131_072 tokens / step
#
# Total token budget:
#   15_000 steps × 131_072 ≈ 1.97 B tokens
#
# Wall-clock estimate on G4 SPOT (~$1.50/hr):
#   ~4-6 h, ~$6-9 total.
#
# Pair with:
#   DATA_TOKENS=1500000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 32
grad_accum     = 4
total_steps    = 15000
peak_lr        = 3e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 500
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
