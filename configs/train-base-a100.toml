# 501M `base` model on a single NVIDIA A100 40GB (a2-highgpu-1g).
#
# Per-step token budget:
#   batch 4 × seq 2048 × grad_accum 8 = 65_536 tokens / step
#
# Total token budget:
#   15_000 steps × 65_536 ≈ 0.98 B tokens
#
# Wall-clock estimate on A100 SPOT (~$1.10/hr):
#   ~25-35 h, ~$28-38 total.
#
# Pair with:
#   DATA_TOKENS=2000000000

train_data     = "data/train.bin"
val_data       = "data/val.bin"
checkpoint_dir = "checkpoints/"

batch_size     = 4
grad_accum     = 8
total_steps    = 15000
peak_lr        = 1e-4
weight_decay   = 0.01
grad_clip      = 1.0

save_every     = 1000
eval_every     = 500
eval_batches   = 20

smoke_test_steps = 0
