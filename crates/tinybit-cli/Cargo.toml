[package]
name    = "tinybit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tinybit"
path = "src/main.rs"

[features]
cuda = ["tinybit-core/cuda", "tinybit-train/cuda", "tinybit-infer/cuda"]

[dependencies]
tinybit-core  = { path = "../tinybit-core" }
tinybit-tools = { path = "../tinybit-tools" }
tinybit-infer = { path = "../tinybit-infer" }
tinybit-train = { path = "../tinybit-train" }
candle-core    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
toml           = { workspace = true }
clap           = { workspace = true }
tokio          = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
hf-hub         = { workspace = true }
